[package]
name = "v100_hxml"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.3", features = ["derive"] }
anyhow = "1.0"
tokio = { version = "1.37", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.8.8", features = ["multipart"] }
maud = { version = "0.27", features = ["axum"] }
thiserror = "2.0.18"
[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5.3", features = ["util"] }